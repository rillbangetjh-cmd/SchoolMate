name: Android CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build, test, and lint
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      # Validates gradle-wrapper.jar checksum and caches Gradle dependencies.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build debug APK
        # Signed with the default Android debug keystore that AGP generates automatically.
        run: ./gradlew assembleDebug --stacktrace

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Android Lint
        run: ./gradlew lintDebug --stacktrace

      - name: Verify APK
        run: |
          APK=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          test -n "$APK" || { echo "No debug APK produced"; exit 1; }
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          "$BT/aapt2" dump badging "$APK" | grep -E "^package:|minSdkVersion|targetSdkVersion"
          "$BT/apksigner" verify --print-certs "$APK" | head -n 3
          ls -lh "$APK"

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: SchoolMate-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: SchoolMate-reports
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore
          retention-days: 14
